<script>
  (function () {
    var dialog = document.getElementById('photo-dialog');
    var titleEl = document.getElementById('dialog-title');
    var subEl = document.getElementById('dialog-sub');
    var slotsEl = document.getElementById('slots');
    var closeBtn = dialog.querySelector('.close');
    var currentKey = null;
    var currentCount = 0;

    // Paths are relative to the HTML file.
    var photos = {
      'tsa-states-2025': [
        'photos/tsa-states-1.jpg',
        'photos/tsa-states-2.jpg',
        'photos/tsa-states-3.jpg'
      ]
    };

    function buildSlots(count) {
      slotsEl.innerHTML = '';
      slotsEl.style.gridTemplateColumns = 'repeat(' + Math.min(count, 3) + ', 1fr)';
      for (var i = 0; i < count; i++) {
        slotsEl.appendChild(createSlot(i));
      }
    }

    function createSlot(i) {
      var label = document.createElement('label');
      label.className = 'slot';

      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';

      var empty = document.createElement('span');
      empty.className = 'slot-empty';
      empty.textContent = '+ Add photo ' + (i + 1);

      var img = document.createElement('img');
      img.alt = '';

      var caption = document.createElement('span');
      caption.className = 'slot-caption';
      caption.textContent = 'Photo ' + (i + 1);

      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        if (!file || !currentKey) return;
        if (!photos[currentKey]) photos[currentKey] = [];
        var old = photos[currentKey][i];
        if (old && old.indexOf('blob:') === 0) URL.revokeObjectURL(old);
        photos[currentKey][i] = URL.createObjectURL(file);
        renderSlots();
        input.value = '';
      });

      label.appendChild(input);
      label.appendChild(empty);
      label.appendChild(img);
      label.appendChild(caption);
      return label;
    }

    function renderSlots() {
      var list = photos[currentKey] || [];
      var slots = slotsEl.querySelectorAll('.slot');
      slots.forEach(function (slot, i) {
        var img = slot.querySelector('img');
        var empty = slot.querySelector('.slot-empty');
        if (list[i]) {
          img.onerror = function () {
            slot.classList.remove('filled');
            empty.textContent = 'Not found: ' + list[i];
          };
          img.onload = function () {
            empty.textContent = '';
          };
          img.src = list[i];
          slot.classList.add('filled');
        } else {
          img.removeAttribute('src');
          empty.textContent = '+ Add photo ' + (i + 1);
          slot.classList.remove('filled');
        }
      });
    }

    function openFor(card) {
      currentKey = card.dataset.award;
      currentCount = parseInt(card.dataset.slots, 10) || 1;
      var heading = card.querySelector('h4, h5');
      titleEl.textContent = heading ? heading.textContent : 'Award';
      subEl.textContent = 'Add up to ' + currentCount + (currentCount === 1 ? ' photo' : ' photos') + ' for this award.';
      buildSlots(currentCount);
      renderSlots();
      dialog.showModal();
    }

    document.querySelectorAll('.award').forEach(function (card) {
      card.addEventListener('click', function (e) {
        e.stopPropagation();
        openFor(card);
      });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          e.stopPropagation();
          openFor(card);
        }
      });
    });

    closeBtn.addEventListener('click', function () { dialog.close(); });
    dialog.addEventListener('click', function (e) {
      if (e.target === dialog) dialog.close();
    });
  })();
</script>
