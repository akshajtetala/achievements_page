<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Akshaj Tetala's achievements, projects, and growth from 8th grade through senior year." />
  <meta name="theme-color" content="#0b1a44" />
  <title>Akshaj Tetala | Achievement Journey</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f1d33;
      --muted: #5b6b85;
      --blue: #2563eb;
      --blue-dark: #1e3fae;
      --blue-light: #60a5fa;
      --blue-soft: #eaf2ff;
      --paper: #ffffff;
      --background: #f5f9ff;
      --line: #dbe6f7;
      --shadow: 0 10px 30px rgb(30 64 175 / 8%);
      --shadow-hover: 0 18px 40px rgb(30 64 175 / 16%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #d9e8ff 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #e0ecff 0%, transparent 35%),
        var(--background);
      background-attachment: fixed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; }
    .container { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }

    /* Netflix-style intro */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #2a54d4 0%, #0b1a44 70%);
      pointer-events: none;
      animation: introOut .6s ease 2.6s forwards;
    }
    .intro-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .monogram {
      color: #ffffff;
      font-size: clamp(5rem, 16vw, 9rem);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      text-shadow: 0 0 40px rgb(96 165 250 / 70%);
      animation: monoIn 1s cubic-bezier(.2, .8, .2, 1) .2s backwards;
    }
    .intro-line {
      height: 3px;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, #93c5fd, transparent);
      animation: lineGrow .8s ease .9s forwards;
    }
    .intro-sub {
      color: #bfdbfe;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .4em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn .7s ease 1.4s forwards;
    }
    @keyframes monoIn {
      0% { opacity: 0; transform: scale(.4); filter: blur(12px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes lineGrow {
      from { width: 0; opacity: 0; }
      to { width: 260px; opacity: 1; }
    }
    @keyframes introOut {
      to { opacity: 0; visibility: hidden; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growLineV {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.6); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Header */
    header {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid rgb(219 230 247 / 70%);
      background: rgb(245 249 255 / 80%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeIn .6s ease 2.4s backwards;
    }
    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo {
      color: var(--blue);
      font-weight: 850;
      font-size: 1.1rem;
      letter-spacing: -.03em;
      text-decoration: none;
    }
    .nav-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav-links a {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;
      text-decoration: none;
      transition: color .2s ease, background .2s ease;
    }
    .nav-links a:hover, .nav-links a:focus-visible { color: var(--blue); background: var(--blue-soft); }

    /* Hero */
    .hero { padding: 90px 0 70px; text-align: center; }
    .eyebrow {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid #bfd6fb;
      border-radius: 999px;
      color: var(--blue);
      background: var(--paper);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
      animation: fadeUp .6s ease 2.6s backwards;
    }
    h1 {
      max-width: 860px;
      margin: 22px auto 18px;
      font-size: clamp(2.8rem, 8vw, 5.6rem);
      line-height: 1;
      letter-spacing: -.07em;
      animation: fadeUp .7s ease 2.7s backwards;
    }
    h1 .accent {
      background: linear-gradient(120deg, var(--blue), var(--blue-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
