<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Akshaj Tetala's achievements, projects, and growth from 8th grade through senior year." />
  <meta name="theme-color" content="#0b1a44" />
  <title>Akshaj Tetala | Achievement Journey</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f1d33;
      --muted: #5b6b85;
      --blue: #2563eb;
      --blue-dark: #1e3fae;
      --blue-light: #60a5fa;
      --blue-soft: #eaf2ff;
      --paper: #ffffff;
      --background: #f5f9ff;
      --line: #dbe6f7;
      --shadow: 0 10px 30px rgb(30 64 175 / 8%);
      --shadow-hover: 0 18px 40px rgb(30 64 175 / 16%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #d9e8ff 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #e0ecff 0%, transparent 35%),
        var(--background);
      background-attachment: fixed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; }
    .container { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }

    /* Netflix-style intro */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #2a54d4 0%, #0b1a44 70%);
      pointer-events: none;
      animation: introOut .8s ease 2.9s forwards;
    }
    .intro-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .monogram {
      color: #ffffff;
      font-size: clamp(5rem, 16vw, 9rem);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      text-shadow: 0 0 40px rgb(96 165 250 / 70%);
      animation: monoIn 1.1s cubic-bezier(.2, .8, .2, 1) .2s both;
    }
    .intro-line {
      height: 3px;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, transparent, #93c5fd, transparent);
      animation: lineGrow .9s ease 1.1s forwards;
    }
    .intro-sub {
      color: #bfdbfe;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .4em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn .8s ease 1.6s forwards;
    }
    @keyframes monoIn {
      0% { opacity: 0; transform: scale(.4); filter: blur(12px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes lineGrow {
      from { width: 0; opacity: 0; }
      to { width: 260px; opacity: 1; }
    }
    @keyframes introOut {
      to { opacity: 0; visibility: hidden; }
    }

    /* Header */
    header {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid rgb(219 230 247 / 70%);
      background: rgb(245 249 255 / 80%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo {
      color: var(--blue);
      font-weight: 850;
      font-size: 1.1rem;
      letter-spacing: -.03em;
      text-decoration: none;
    }
    .nav-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav-links a {
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 600;
      text-decoration: none;
      transition: color .2s ease, background .2s ease;
    }
    .nav-links a:hover, .nav-links a:focus-visible { color: var(--blue); background: var(--blue-soft); }

    /* Hero */
    .hero { padding: 90px 0 70px; text-align: center; }
    .eyebrow {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid #bfd6fb;
      border-radius: 999px;
      color: var(--blue);
      background: var(--paper);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 860px;
      margin: 22px auto 18px;
      font-size: clamp(2.8rem, 8vw, 5.6rem);
      line-height: 1;
      letter-spacing: -.07em;
    }
    h1 .accent {
      background: linear-gradient(120deg, var(--blue), var(--blue-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-copy { max-width: 620px; margin: 0 auto 30px; color: var(--muted); font-size: 1.12rem; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .button {
      display: inline-block;
      padding: 13px 22px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .button:hover { transform: translateY(-2px); }
    .button.primary {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      box-shadow: 0 10px 24px rgb(37 99 235 / 30%);
    }
    .button.primary:hover { box-shadow: 0 14px 30px rgb(37 99 235 / 40%); }
    .button.secondary { border-color: var(--line); color: var(--ink); background: var(--paper); }
    .button.secondary:hover { border-color: #a9c6f5; }

    /* Sections */
    section { padding: 60px 0; }
    .section-heading { margin: 0 auto 38px; text-align: center; }
    .section-heading h2 { margin: 0 0 6px; font-size: clamp(2rem, 5vw, 2.9rem); letter-spacing: -.05em; }
    .section-heading p { margin: 0; color: var(--muted); }

    /* Timeline */
    .timeline { position: relative; max-width: 780px; margin: 0 auto; }
    .timeline::before {
      position: absolute; top: 14px; bottom: 14px; left: 17px; width: 2px;
      background: linear-gradient(var(--blue-light), var(--line));
      content: "";
    }
    .year { position: relative; margin-bottom: 34px; padding-left: 58px; }
    .year::before {
      position: absolute; top: 4px; left: 4px; width: 28px; height: 28px;
      border: 5px solid var(--background); border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 1px #bfd6fb, 0 4px 12px rgb(37 99 235 / 30%);
      content: "";
    }
    .year h3 {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .achievement {
      margin-bottom: 12px; padding: 20px 22px; border: 1px solid var(--line);
      border-radius: 16px; background: var(--paper); box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .achievement:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .achievement h4 { margin: 0 0 6px; font-size: 1.05rem; letter-spacing: -.01em; }
    .achievement p { margin: 0; color: var(--muted); font-size: .95rem; }
    .achievement.pending { border-style: dashed; border-color: #b9cfef; background: transparent; box-shadow: none; }
    .achievement.pending h4 { color: var(--muted); font-weight: 600; }
    .tag {
      display: inline-block; margin-top: 12px; padding: 4px 10px; border-radius: 999px;
      color: var(--blue-dark); background: var(--blue-soft); font-size: .74rem; font-weight: 750;
    }

    /* Highlights */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card {
      padding: 26px; border: 1px solid var(--line); border-radius: 18px;
      background: var(--paper);
